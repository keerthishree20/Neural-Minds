<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>City Search | GlobeTrotter Lite</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="container">

    <h2>Search Cities 🌍</h2>
    <p>Find and add cities to your trip</p>

    <input
        type="text"
        id="searchInput"
        placeholder="Search city name..."
        onkeyup="searchCity()"
    >

    <div id="cityList"></div>

    <br>
    <button onclick="goBack()">⬅ Back to Dashboard</button>

</div>

<script src="js/city.js"></script>

</body>
</html>
